name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Leak check
        run: scripts/check-public.sh .
      - name: Allowlist and leak-check tests
        run: bash scripts/tests/test-public.sh
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
      - name: Benchmark verifier tests
        run: python3 -I dogfood/test_verify.py
      - name: README numbers match the benchmark
        run: python3 -I scripts/check-readme-numbers.py README.md docs/benchmark.md && python3 -I scripts/tests/test_readme_numbers.py
      - name: Demo tooling tests
        run: python3 -I demos/lib/test_events.py
