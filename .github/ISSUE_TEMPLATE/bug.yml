name: Bug
description: chauffeur did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command and its full output
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `chauffeur doctor`
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: chauffeur, Xcode, macOS and simulator iOS versions
      placeholder: chauffeur 0.1.1, Xcode 27.0, macOS 27.0, iOS 27.0
    validations:
      required: true
